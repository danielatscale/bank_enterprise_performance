unique_name: Date Dimension
object_type: dimension
label: Date Dimension
description: Conformed calendar date dimension shared by all four fact tables (one time axis for the whole bank). Year > Quarter > Month > Day with prior-year parallel periods for year-over-year analysis.
type: time
hierarchies:
- unique_name: Date Hierarchy
  label: Date Hierarchy
  description: 'Gregorian calendar: Year > Quarter > Month > Day.'
  filter_empty: 'yes'
  folder: Date Attributes
  levels:
  - unique_name: Year
  - unique_name: Quarter
    parallel_periods:
    - key_columns:
      - prior_year_quarter_name
      level: Year
  - unique_name: Month
    parallel_periods:
    - key_columns:
      - prior_year_year_month
      level: Year
  - unique_name: Day
    secondary_attributes:
    - unique_name: Is Month End
      label: Is Month End
      description: Flags month-end dates (the deposit and facility snapshot dates).
      dataset: dim_date
      name_column: is_month_end
      key_columns:
      - date_id
level_attributes:
- unique_name: Year
  label: Year
  description: Calendar year.
  dataset: dim_date
  key_columns:
  - year_num
  name_column: year_num
  sort_column: year_num
  time_unit: year
- unique_name: Quarter
  label: Quarter
  description: Calendar quarter (year-qualified, e.g. Q1 2024).
  dataset: dim_date
  key_columns:
  - quarter_name
  name_column: quarter_name
  sort_column: quarter_sort
  time_unit: quarter
- unique_name: Month
  label: Month
  description: Calendar month (year-qualified, e.g. 2024-01).
  dataset: dim_date
  key_columns:
  - year_month
  name_column: year_month
  sort_column: year_month
  time_unit: month
- unique_name: Day
  label: Day
  description: Calendar day.
  dataset: dim_date
  is_unique_key: true
  key_columns:
  - date_id
  name_column: date_id
  sort_column: date_id
  time_unit: day
