  name_column: regulatory_class
- unique_name: Rating Grade
  label: Rating Grade
  description: Regulatory rating grade (1-3 Strong ... 9 Doubtful).
  is_unique_key: true
  dataset: dim_risk_rating
  key_columns:
  - risk_rating_id
  name_column: rating_grade
