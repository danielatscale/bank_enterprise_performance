type: standard
hierarchies:
- unique_name: Risk Rating Hierarchy
  label: Risk Rating Hierarchy
  folder: Credit Attributes
  levels:
  - unique_name: Regulatory Class
  - unique_name: Rating Grade
    secondary_attributes:
