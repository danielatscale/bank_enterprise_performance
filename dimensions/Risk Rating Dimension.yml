      label: Is Nonperforming
      description: Flags non-performing rating grades.
      dataset: dim_risk_rating
      name_column: is_nonperforming
      key_columns:
      - risk_rating_id
level_attributes:
- unique_name: Regulatory Class
  label: Regulatory Class
  description: 'Regulatory classification: Pass, Criticized, or Classified.'
