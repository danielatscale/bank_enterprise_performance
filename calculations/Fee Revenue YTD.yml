unique_name: Fee Revenue YTD
object_type: metric_calc
label: Fee Revenue YTD
description: Year-to-date payments fee revenue.
expression: 'CASE WHEN ISEMPTY([Measures].[Fee Revenue]) THEN NULL

  ELSE Aggregate(PeriodsToDate([Date Dimension].[Date Hierarchy].[Year], [Date Dimension].[Date Hierarchy].CurrentMember), [Measures].[Fee Revenue]) END'
format: $#,##0
