unique_name: Fee Revenue Prior Year
object_type: metric_calc
label: Fee Revenue Prior Year
description: Commercial payments fee revenue for the same period one year prior.
expression: 'CASE WHEN ISEMPTY([Measures].[Fee Revenue]) THEN NULL

  ELSE (ParallelPeriod([Date Dimension].[Date Hierarchy].[Year], 1, [Date Dimension].[Date Hierarchy].CurrentMember), [Measures].[Fee Revenue]) END'
format: $#,##0
