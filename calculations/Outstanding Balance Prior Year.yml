unique_name: Outstanding Balance Prior Year
object_type: metric_calc
label: Outstanding Balance Prior Year
description: Facility outstanding balance one year prior.
expression: 'CASE WHEN ISEMPTY([Measures].[Outstanding Balance]) THEN NULL

  ELSE (ParallelPeriod([Date Dimension].[Date Hierarchy].[Year], 1, [Date Dimension].[Date Hierarchy].CurrentMember), [Measures].[Outstanding Balance]) END'
format: $#,##0
