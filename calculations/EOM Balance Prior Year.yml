unique_name: EOM Balance Prior Year
object_type: metric_calc
label: EOM Balance Prior Year
description: End-of-month deposit balance one year prior.
expression: 'CASE WHEN ISEMPTY([Measures].[EOM Balance]) THEN NULL

  ELSE (ParallelPeriod([Date Dimension].[Date Hierarchy].[Year], 1, [Date Dimension].[Date Hierarchy].CurrentMember), [Measures].[EOM Balance]) END'
format: $#,##0
