unique_name: Risk Rating Dimension
object_type: dimension
label: Risk Rating
description: 'Regulatory credit risk rating of commercial facilities: Regulatory Class > Rating Grade.'
type: standard
hierarchies:
- unique_name: Risk Rating Hierarchy
  label: Risk Rating
  folder: Risk Attributes
  description: Regulatory Class (Pass / Criticized / Classified) > Rating Grade.
  levels:
  - unique_name: Regulatory Class
  - unique_name: Rating Grade
    secondary_attributes:
    - unique_name: Is Nonperforming Grade
      label: Is Nonperforming Grade
      description: True for grades considered non-performing.
      dataset: dim_risk_rating
      name_column: is_nonperforming
      key_columns:
      - is_nonperforming
level_attributes:
- unique_name: Regulatory Class
  label: Regulatory Class
  description: Pass, Criticized, or Classified.
  dataset: dim_risk_rating
  name_column: regulatory_class
  key_columns:
  - regulatory_class
- unique_name: Rating Grade
  label: Rating Grade
  description: 1-3 Strong, 4-6 Acceptable, 7 Special Mention, 8 Substandard, 9 Doubtful.
  dataset: dim_risk_rating
  name_column: rating_grade
  key_columns:
  - risk_rating_id
  is_unique_key: true
