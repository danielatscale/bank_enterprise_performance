unique_name: Date Dimension
object_type: dimension
label: Date Dimension
description: "Conformed calendar shared by all four lines of business. Year > Quarter > Month > Day; fiscal year = calendar year. Deposit and facility snapshots are dated the 1st of each month."
type: time
hierarchies:
- unique_name: Date Hierarchy
  label: Calendar
  description: "Calendar rollup Year > Quarter > Month > Day."
  folder: Date Attributes
  levels:
  - unique_name: Year
  - unique_name: Quarter
    parallel_periods:
    - key_columns:
      - prior_year_num
      - quarter_num
      level: Year
    secondary_attributes:
    - unique_name: Quarter Number
      label: Quarter Number
      description: Quarter number within the year (1-4).
      dataset: dim_date
      name_column: quarter_num
      key_columns:
      - quarter_num
  - unique_name: Month
    parallel_periods:
    - key_columns:
      - prior_year_num
      - month_num
      level: Year
    secondary_attributes:
    - unique_name: Month Name
      label: Month Name
      description: Month name (January..December), without the year.
      dataset: dim_date
      name_column: month_name
      key_columns:
      - month_name
      sort_column: month_num
  - unique_name: Day
    secondary_attributes:
    - unique_name: Day Name
      label: Day Name
      description: Day of week name (Monday..Sunday).
      dataset: dim_date
      name_column: day_name
      key_columns:
      - day_name
      sort_column: day_of_week
level_attributes:
- unique_name: Year
  label: Year
  description: Calendar year. 2023 and 2026 are partial years in this data (Jul-Dec 2023, Jan-Jun 2026).
  dataset: dim_date
  name_column: year_num
  key_columns:
  - year_num
  sort_column: year_num
  time_unit: year
- unique_name: Quarter
  label: Quarter
  description: Year-qualified quarter (e.g. Q1 2025), sorted chronologically.
  dataset: dim_date
  name_column: quarter_name
  key_columns:
  - year_num
  - quarter_num
  sort_column: quarter_sort
  time_unit: quarter
- unique_name: Month
  label: Month
  description: Year-qualified month, format YYYY-MM (e.g. 2025-03).
  dataset: dim_date
  name_column: year_month
  key_columns:
  - year_num
  - month_num
  sort_column: year_month
  time_unit: month
- unique_name: Day
  label: Day
  description: Calendar day. Snapshots are dated the 1st of each month.
  is_unique_key: true
  dataset: dim_date
  name_column: date_id
  key_columns:
  - date_id
  sort_column: date_id
  time_unit: day
