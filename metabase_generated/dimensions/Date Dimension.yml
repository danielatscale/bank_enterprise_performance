unique_name: Date Dimension
object_type: dimension
label: Date
description: Conformed calendar shared by all four lines of business. Calendar Year > Quarter > Month > Day (fiscal year =
  calendar year). Snapshots are dated the 1st of each month.
type: time
hierarchies:
- unique_name: Date Hierarchy
  label: Calendar
  description: Year > Quarter > Month > Day.
  folder: Date Attributes
  filter_empty: 'yes'
  levels:
  - unique_name: Year
  - unique_name: Quarter
    parallel_periods:
    - key_columns:
      - prior_year_quarter_key
      level: Year
    secondary_attributes:
    - unique_name: Quarter Number
      label: Quarter Number
      description: Quarter number within the year (1-4).
      dataset: dim_date
      name_column: quarter_num
      key_columns:
      - quarter_num
      sort_column: quarter_num
  - unique_name: Month
    parallel_periods:
    - key_columns:
      - prior_year_month
      level: Year
    secondary_attributes:
    - unique_name: Month of Year
      label: Month Name
      description: Month name (January..December), sorted by month number.
      dataset: dim_date
      name_column: month_name
      key_columns:
      - month_num
      sort_column: month_num
  - unique_name: Day
    parallel_periods:
    - key_columns:
      - prior_year_date
      level: Year
    secondary_attributes:
    - unique_name: Day of Week
      label: Day Name
      description: Day of week name (Monday..Sunday), sorted by day number.
      dataset: dim_date
      name_column: day_name
      key_columns:
      - day_of_week
      sort_column: day_of_week
    - unique_name: Day of Month
      label: Day Of Month
      description: Day of month (1-31).
      dataset: dim_date
      name_column: day_of_month
      key_columns:
      - day_of_month
      sort_column: day_of_month
level_attributes:
- unique_name: Year
  label: Year
  description: Calendar year. 2023 and 2026 are partial years in this data (Jul-Dec 2023, Jan-Jun 2026).
  dataset: dim_date
  name_column: year_num
  key_columns:
  - year_num
  sort_column: year_num
  time_unit: year
- unique_name: Quarter
  label: Quarter
  description: Year-qualified quarter, e.g. 'Q1 2025', sorted chronologically.
  dataset: dim_date
  name_column: quarter_name
  key_columns:
  - quarter_key
  sort_column: quarter_key
  time_unit: quarter
- unique_name: Month
  label: Month
  description: Year-qualified month, format YYYY-MM (e.g. 2025-03).
  dataset: dim_date
  name_column: year_month
  key_columns:
  - year_month
  sort_column: year_month
  time_unit: month
- unique_name: Day
  label: Date
  description: Calendar day; the join grain for every fact.
  dataset: dim_date
  name_column: date_id
  key_columns:
  - date_id
  sort_column: date_id
  is_unique_key: true
  time_unit: day
