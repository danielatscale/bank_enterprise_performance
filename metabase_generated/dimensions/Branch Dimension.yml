unique_name: Branch Dimension
object_type: dimension
label: Branch
description: 'Branch geography: Region > State > Market (from the Market table) > Branch. Used by Retail Deposits and Consumer
  Lending.'
type: standard
hierarchies:
- unique_name: Branch Geography
  label: Branch Geography
  description: Region > State > Market > Branch; geography comes from the branch's market.
  folder: Branch Attributes
  levels:
  - unique_name: Region
  - unique_name: State
  - unique_name: Market
  - unique_name: Branch
    secondary_attributes:
    - unique_name: Branch Type
      label: Branch Type
      description: 'Branch format: Financial Center, In-Store, or Private Bank Office.'
      dataset: dim_branch
      name_column: branch_type
      key_columns:
      - branch_type
level_attributes:
- unique_name: Region
  label: Region
  description: 'Geographic region: Great Lakes, Northeast, Pacific, Rocky Mountains.'
  dataset: dim_market
  name_column: region
  key_columns:
  - region
- unique_name: State
  label: State
  description: US state of the market.
  dataset: dim_market
  name_column: state
  key_columns:
  - state
- unique_name: Market
  label: Market
  description: Metro market.
  dataset: dim_market
  name_column: market_name
  key_columns:
  - market_id
  is_unique_key: true
- unique_name: Branch
  label: Branch
  description: Branch name; lowest level of branch geography.
  dataset: dim_branch
  name_column: branch_name
  key_columns:
  - branch_id
  is_unique_key: true
relationships:
- from:
    dataset: dim_branch
    join_columns:
    - market_id
  to:
    level: Market
  type: snowflake
