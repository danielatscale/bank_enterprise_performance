unique_name: Branch Dimension
object_type: dimension
label: Branch Dimension
description: "Branch geography Region > State > Market > Branch. State and region come from the Market table so every fact rolls up the same way."
type: standard
hierarchies:
- unique_name: Branch Geography
  label: Branch Geography
  description: "Region > State > Market > Branch."
  folder: Branch Attributes
  levels:
  - unique_name: Region
  - unique_name: State
  - unique_name: Market
  - unique_name: Branch
    secondary_attributes:
    - unique_name: Branch Type
      label: Branch Type
      description: "Branch format: Financial Center, In-Store, or Private Bank Office."
      dataset: dim_branch
      name_column: branch_type
      key_columns:
      - branch_type
level_attributes:
- unique_name: Region
  label: Region
  description: "Geographic region of the branch's market: Great Lakes, Northeast, Pacific, Rocky Mountains."
  dataset: dim_market
  name_column: region
  key_columns:
  - region
- unique_name: State
  label: State
  description: "US state of the branch's market."
  dataset: dim_market
  name_column: state
  key_columns:
  - state
- unique_name: Market
  label: Market
  description: Metro market.
  is_unique_key: true
  dataset: dim_market
  name_column: market_name
  key_columns:
  - market_id
- unique_name: Branch
  label: Branch
  description: Branch. Lowest level of branch geography.
  is_unique_key: true
  dataset: dim_branch
  name_column: branch_name
  key_columns:
  - branch_id
relationships:
- from:
    dataset: dim_branch
    join_columns:
    - market_id
  to:
    level: Market
  type: snowflake
