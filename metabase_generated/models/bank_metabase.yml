unique_name: bank_metabase
object_type: model
label: Bank Enterprise Performance
description: Four lines of business sharing conformed Date, Branch, Customer and Product dimensions, so each area can be analyzed alone or rolled up across the bank. Built from the Metabase catalog.
visible: true
relationships:
- unique_name: fact_deposit_snapshot_Date_Dimension
  from:
    dataset: fact_deposit_snapshot
    join_columns:
    - snapshot_date
  to:
    dimension: Date Dimension
    level: Day
- unique_name: fact_loan_facility_snapshot_Date_Dimension
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - snapshot_date
  to:
    dimension: Date Dimension
    level: Day
- unique_name: fact_loan_origination_Date_Dimension
  from:
    dataset: fact_loan_origination
    join_columns:
    - origination_date
  to:
    dimension: Date Dimension
    level: Day
- unique_name: fact_payment_transaction_Date_Dimension
  from:
    dataset: fact_payment_transaction
    join_columns:
    - activity_month
  to:
    dimension: Date Dimension
    level: Day
- unique_name: fact_deposit_snapshot_Branch_Dimension
  from:
    dataset: fact_deposit_snapshot
    join_columns:
    - branch_id
  to:
    dimension: Branch Dimension
    level: Branch
- unique_name: fact_deposit_snapshot_Product_Dimension
  from:
    dataset: fact_deposit_snapshot
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: fact_loan_facility_snapshot_Customer_Dimension
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - customer_id
  to:
    dimension: Customer Dimension
    level: Customer
- unique_name: fact_loan_facility_snapshot_Product_Dimension
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: fact_loan_facility_snapshot_Line_of_Business_Dimension
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - lob_id
  to:
    dimension: Line of Business Dimension
    level: Line of Business
- unique_name: fact_loan_facility_snapshot_Risk_Rating_Dimension
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - risk_rating_id
  to:
    dimension: Risk Rating Dimension
    level: Rating Grade
- unique_name: fact_loan_origination_Customer_Dimension
  from:
    dataset: fact_loan_origination
    join_columns:
    - customer_id
  to:
    dimension: Customer Dimension
    level: Customer
- unique_name: fact_loan_origination_Branch_Dimension
  from:
    dataset: fact_loan_origination
    join_columns:
    - branch_id
  to:
    dimension: Branch Dimension
    level: Branch
- unique_name: fact_loan_origination_Product_Dimension
  from:
    dataset: fact_loan_origination
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: fact_payment_transaction_Customer_Dimension
  from:
    dataset: fact_payment_transaction
    join_columns:
    - customer_id
  to:
    dimension: Customer Dimension
    level: Customer
- unique_name: fact_payment_transaction_Product_Dimension
  from:
    dataset: fact_payment_transaction
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
