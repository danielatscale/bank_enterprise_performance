unique_name: fact_loan_facility_snapshot
object_type: dataset
label: fact_loan_facility_snapshot
description: CRE + Middle Market facility monthly snapshot (facility x month, dated the 1st). Commitment/outstanding/undrawn
  are point-in-time.
connection_id: Bank Enterprise Performance Connection
table: fact_loan_facility_snapshot
columns:
- name: facility_snapshot_id
  data_type: long
- name: snapshot_date
  data_type: date
- name: facility_id
  data_type: long
- name: customer_id
  data_type: long
- name: product_id
  data_type: long
- name: lob_id
  data_type: long
- name: risk_rating_id
  data_type: long
- name: commitment_amount
  data_type: decimal
- name: outstanding_balance
  data_type: decimal
- name: undrawn_amount
  data_type: decimal
- name: interest_income_mtd
  data_type: decimal
- name: nim_bps
  data_type: double
- name: is_nonperforming
  data_type: boolean
- name: nonperforming_balance
  data_type: decimal
  sql: CASE WHEN is_nonperforming THEN outstanding_balance ELSE 0 END
