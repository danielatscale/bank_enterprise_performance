unique_name: EOM Balance YoY Growth Pct
object_type: metric_calc
label: "EOM Balance YoY Growth %"
description: "Year-over-year growth: (EOM Balance - EOM Balance Prior Year) / EOM Balance Prior Year."
expression: "CASE WHEN ISEMPTY([Measures].[EOM Balance Prior Year]) THEN NULL\nELSE Divide([Measures].[EOM Balance] - [Measures].[EOM Balance Prior Year], [Measures].[EOM Balance Prior Year]) END"
format: percent
