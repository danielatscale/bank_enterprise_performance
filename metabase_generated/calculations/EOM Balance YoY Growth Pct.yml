unique_name: EOM Balance YoY Growth %
object_type: metric_calc
label: EOM Balance YoY Growth %
description: (EOM Balance - same period last year) / same period last year.
expression: 'CASE WHEN ISEMPTY([Measures].[EOM Balance Prior Year]) THEN NULL

  WHEN [Measures].[EOM Balance Prior Year] = 0 THEN NULL

  ELSE ([Measures].[EOM Balance] - [Measures].[EOM Balance Prior Year]) / [Measures].[EOM Balance Prior Year] END'
format: 0.00%
folder: Retail Deposits
