unique_name: Fee Revenue YoY Growth Pct
object_type: metric_calc
label: "Fee Revenue YoY Growth %"
description: "Year-over-year growth: (Fee Revenue - Fee Revenue Prior Year) / Fee Revenue Prior Year."
expression: "CASE WHEN ISEMPTY([Measures].[Fee Revenue Prior Year]) THEN NULL\nELSE Divide([Measures].[Fee Revenue] - [Measures].[Fee Revenue Prior Year], [Measures].[Fee Revenue Prior Year]) END"
format: percent
