unique_name: Fee Revenue YoY Growth %
object_type: metric_calc
label: Fee Revenue YoY Growth %
description: (Fee Revenue - same period last year) / same period last year.
expression: 'CASE WHEN ISEMPTY([Measures].[Fee Revenue Prior Year]) THEN NULL

  WHEN [Measures].[Fee Revenue Prior Year] = 0 THEN NULL

  ELSE ([Measures].[Fee Revenue] - [Measures].[Fee Revenue Prior Year]) / [Measures].[Fee Revenue Prior Year] END'
format: 0.00%
folder: Commercial Payments
