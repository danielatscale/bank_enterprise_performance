unique_name: Loan Amount Originated Prior Year
object_type: metric_calc
label: Loan Amount Originated Prior Year
description: Loan Amount Originated for the same period one year earlier (same calendar level, prior year).
expression: "CASE WHEN ISEMPTY([Measures].[Loan Amount Originated]) THEN NULL\nELSE (ParallelPeriod([Date Dimension].[Date Hierarchy].[Year], 1, [Date Dimension].[Date Hierarchy].CurrentMember), [Measures].[Loan Amount Originated]) END"
format: "$#,##0"
