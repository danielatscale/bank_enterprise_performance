unique_name: Outstanding Balance YoY Growth Pct
object_type: metric_calc
label: "Outstanding Balance YoY Growth %"
description: "Year-over-year growth: (Outstanding Balance - Outstanding Balance Prior Year) / Outstanding Balance Prior Year."
expression: "CASE WHEN ISEMPTY([Measures].[Outstanding Balance Prior Year]) THEN NULL\nELSE Divide([Measures].[Outstanding Balance] - [Measures].[Outstanding Balance Prior Year], [Measures].[Outstanding Balance Prior Year]) END"
format: percent
