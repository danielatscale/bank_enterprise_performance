unique_name: Outstanding Balance YoY Growth %
object_type: metric_calc
label: Outstanding Balance YoY Growth %
description: (Outstanding Balance - same period last year) / same period last year.
expression: 'CASE WHEN ISEMPTY([Measures].[Outstanding Balance Prior Year]) THEN NULL

  WHEN [Measures].[Outstanding Balance Prior Year] = 0 THEN NULL

  ELSE ([Measures].[Outstanding Balance] - [Measures].[Outstanding Balance Prior Year]) / [Measures].[Outstanding Balance
  Prior Year] END'
format: 0.00%
folder: CRE + Middle Market
