unique_name: Fee Revenue YTD
object_type: metric_calc
label: Fee Revenue YTD
description: Fee Revenue from the start of the calendar year through the period.
expression: 'CASE WHEN ISEMPTY([Measures].[Fee Revenue]) THEN NULL

  ELSE Aggregate(PeriodsToDate([Date Dimension].[Date Hierarchy].[Year], [Date Dimension].[Date Hierarchy].CurrentMember),
  [Measures].[Fee Revenue]) END'
format: $#,##0
folder: Commercial Payments
