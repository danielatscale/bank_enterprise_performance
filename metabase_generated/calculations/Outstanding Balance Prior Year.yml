unique_name: Outstanding Balance Prior Year
object_type: metric_calc
label: Outstanding Balance Prior Year
description: Outstanding Balance for the same period one year earlier (same calendar level, prior year).
expression: "CASE WHEN ISEMPTY([Measures].[Outstanding Balance]) THEN NULL\nELSE (ParallelPeriod([Date Dimension].[Date Hierarchy].[Year], 1, [Date Dimension].[Date Hierarchy].CurrentMember), [Measures].[Outstanding Balance]) END"
format: "$#,##0"
