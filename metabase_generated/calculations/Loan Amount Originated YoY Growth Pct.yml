unique_name: Loan Amount Originated YoY Growth %
object_type: metric_calc
label: Loan Amount Originated YoY Growth %
description: (Loan Amount Originated - same period last year) / same period last year.
expression: 'CASE WHEN ISEMPTY([Measures].[Loan Amount Originated Prior Year]) THEN NULL

  WHEN [Measures].[Loan Amount Originated Prior Year] = 0 THEN NULL

  ELSE ([Measures].[Loan Amount Originated] - [Measures].[Loan Amount Originated Prior Year]) / [Measures].[Loan Amount Originated
  Prior Year] END'
format: 0.00%
folder: Consumer Lending
