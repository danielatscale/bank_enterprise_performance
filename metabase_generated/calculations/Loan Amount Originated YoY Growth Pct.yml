unique_name: Loan Amount Originated YoY Growth Pct
object_type: metric_calc
label: "Loan Amount Originated YoY Growth %"
description: "Year-over-year growth: (Loan Amount Originated - Loan Amount Originated Prior Year) / Loan Amount Originated Prior Year."
expression: "CASE WHEN ISEMPTY([Measures].[Loan Amount Originated Prior Year]) THEN NULL\nELSE Divide([Measures].[Loan Amount Originated] - [Measures].[Loan Amount Originated Prior Year], [Measures].[Loan Amount Originated Prior Year]) END"
format: percent
