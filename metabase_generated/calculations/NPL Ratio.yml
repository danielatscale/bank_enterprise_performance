unique_name: NPL Ratio
object_type: metric_calc
label: NPL Ratio
description: "Non-performing loan ratio: Nonperforming Balance / Outstanding Balance, both from the latest monthly snapshot in the period. Computed from the balances, never an average of ratios."
expression: "Divide([Measures].[Nonperforming Balance], [Measures].[Outstanding Balance])"
format: percent
