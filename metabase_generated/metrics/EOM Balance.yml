unique_name: EOM Balance
object_type: metric
label: EOM Balance
description: "Total end-of-month deposit balance. Point-in-time: for any period, the balance from the latest monthly snapshot in that period; adds across branches, products and segments, never across months."
calculation_method: sum
folder: Retail Deposits
format: "$#,##0"
semi_additive:
  position: last
  relationships:
  - fact_deposit_snapshot_Date_Dimension
unrelated_dimensions_handling: repeat
dataset: fact_deposit_snapshot
column: eom_balance
