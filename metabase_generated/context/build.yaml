# build.yaml for generating the AtScale SML model from the Metabase export.
# Everything substantive comes from the files below, which were read from Metabase.
inputs:
  use_case: ./use_case.md
  ddl: ./ddl.sql
  erd: ./erd.mmd
  data_source:
    data_profile_yaml: ./data_profile.yaml
output_dir: ../../bank_enterprise_performance/metabase_generated
unrelated_dimension_handling: repeat
warehouse: BigQuery
database: atscale-sales-demo
schema: BANK_ENTERPRISE_PERFORMANCE
model_unique_name: bank_metabase
catalog_unique_name: bank_metabase_catalog
currency: USD
time_window: calendar
semi_additive_default: last_non_empty
mode: programmatic
