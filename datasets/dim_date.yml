unique_name: dim_date
object_type: dataset
label: dim_date
description: Conformed calendar date dimension source, one row per day (2023-07-01..2026-06-30). is_month_end flags monthly-snapshot dates. Adds prior_year_quarter_name / prior_year_year_month (prior-year keys for the Quarter and Month ParallelPeriod, matching each level's STRING key) and quarter_sort for chronological quarter ordering.
connection_id: bank_enterprise_performance_connection
table: dim_date
columns:
- name: date_id
  data_type: date
- name: day_of_week
  data_type: long
- name: day_name
  data_type: string
- name: day_of_month
  data_type: long
- name: month_num
  data_type: long
- name: month_name
  data_type: string
- name: year_month
  data_type: string
- name: quarter_num
  data_type: long
- name: quarter_name
  data_type: string
- name: year_num
  data_type: long
- name: is_weekend
  data_type: boolean
- name: is_month_end
  data_type: boolean
- name: prior_year_quarter_name
  data_type: string
  sql: CONCAT('Q', CAST(quarter_num AS STRING), ' ', CAST(year_num - 1 AS STRING))
- name: prior_year_year_month
  data_type: string
  sql: FORMAT('%d-%02d', year_num - 1, month_num)
- name: quarter_sort
  data_type: long
  sql: year_num * 10 + quarter_num
