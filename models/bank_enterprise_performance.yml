unique_name: bank_enterprise_performance
object_type: model
label: Bank Enterprise Performance
description: Unified enterprise-performance model for a US retail + commercial bank. Four lines of business (Retail Deposits, Consumer Lending, Commercial Payments, CRE + Middle Market) over seven conformed dimensions in a constellation (galaxy) schema.
visible: true
relationships:
- unique_name: fact_deposit_snapshot_Date
  from:
    dataset: fact_deposit_snapshot
    join_columns:
    - snapshot_date
  to:
    dimension: Date Dimension
    level: Day
- unique_name: fact_deposit_snapshot_Branch
  from:
    dataset: fact_deposit_snapshot
    join_columns:
    - branch_id
  to:
    dimension: Branch Dimension
    level: Branch
- unique_name: fact_deposit_snapshot_Product
  from:
    dataset: fact_deposit_snapshot
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: fact_loan_origination_Date
  from:
    dataset: fact_loan_origination
    join_columns:
    - origination_date
  to:
    dimension: Date Dimension
    level: Day
- unique_name: fact_loan_origination_Branch
  from:
    dataset: fact_loan_origination
    join_columns:
    - branch_id
  to:
    dimension: Branch Dimension
    level: Branch
- unique_name: fact_loan_origination_Product
  from:
    dataset: fact_loan_origination
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: fact_loan_origination_Customer
  from:
    dataset: fact_loan_origination
    join_columns:
    - customer_id
  to:
    dimension: Customer Dimension
    level: Customer
- unique_name: fact_payment_transaction_Date
  from:
    dataset: fact_payment_transaction
    join_columns:
    - activity_month
  to:
    dimension: Date Dimension
    level: Day
- unique_name: fact_payment_transaction_Product
  from:
    dataset: fact_payment_transaction
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: fact_payment_transaction_Customer
  from:
    dataset: fact_payment_transaction
    join_columns:
    - customer_id
  to:
    dimension: Customer Dimension
    level: Customer
- unique_name: fact_loan_facility_snapshot_Date
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - snapshot_date
  to:
    dimension: Date Dimension
    level: Day
- unique_name: fact_loan_facility_snapshot_Product
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: fact_loan_facility_snapshot_Customer
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - customer_id
  to:
    dimension: Customer Dimension
    level: Customer
- unique_name: fact_loan_facility_snapshot_LineOfBusiness
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - lob_id
  to:
    dimension: Line of Business Dimension
    level: Line of Business
- unique_name: fact_loan_facility_snapshot_RiskRating
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - risk_rating_id
  to:
    dimension: Risk Rating Dimension
    level: Rating Grade
